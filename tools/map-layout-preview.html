<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map Layout Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      color: #f4e9c9;
      background: #11151d;
    }

    h1,
    p {
      margin: 0;
    }

    p {
      margin-top: 8px;
      color: #aeb7c2;
    }

    .preview-frame {
      display: block;
      width: 390px;
      height: 844px;
      margin-top: 16px;
      border: 1px solid #aa8b52;
      background: #080b12;
    }
  </style>
</head>
<body>
  <main>
    <h1>Mobile map preview</h1>
    <p>390 × 844 CSS px</p>
    <iframe
      class="preview-frame"
      src="../index.html"
      title="Grand Battle Simulator mobile preview"
    ></iframe>
  </main>
</body>
</html>
