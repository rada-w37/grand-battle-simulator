<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Battle Simulator</title>
  <link rel="stylesheet" href="style.css?v=20260810-guild-underline-only">
</head>
<body>
  <main class="app-shell">
    <h1 class="visually-hidden">Grand Battle Simulator</h1>

    <div class="top-layout">
      <section class="panel source-panel" aria-labelledby="source-heading">
      <h2 id="source-heading" class="visually-hidden">バトルデータ選択</h2>
      <fieldset class="source-grid">
        <legend class="visually-hidden">サーバー・ワールド</legend>
        <label>
          <span>サーバー</span>
          <select id="server-select">
            <option value="1">Japan</option>
            <option value="2">Korea</option>
            <option value="3">Asia</option>
            <option value="4">North America</option>
            <option value="5">Europe</option>
            <option value="6">Global</option>
          </select>
        </label>

        <label>
          <span>ワールド</span>
          <div class="combo-box">
            <input type="text" id="world-input" name="grand-battle-world" placeholder="W1" autocomplete="new-password" inputmode="numeric" aria-controls="world-suggestions">
            <datalist id="world-options"></datalist>
            <div id="world-suggestions" class="combo-options" role="listbox" hidden></div>
          </div>
        </label>

      </fieldset>

      <div class="selection-backing-controls" hidden>
        <select id="class-select" aria-hidden="true" tabindex="-1">
          <option value="3">グランドマスター</option>
          <option value="2">エキスパート</option>
          <option value="1">エリート</option>
        </select>
        <select id="block-select" aria-hidden="true" tabindex="-1">
          <option value="0">A</option>
          <option value="1">B</option>
          <option value="2">C</option>
          <option value="3">D</option>
        </select>
      </div>

      <section class="battle-selection" aria-label="クラスとブロックの選択">
        <div id="battle-class-tabs" class="battle-class-tabs" role="tablist" aria-label="クラス">
          <button type="button" class="battle-class-tab" data-class-value="3" role="tab" aria-selected="true">グランドマスター</button>
          <button type="button" class="battle-class-tab" data-class-value="2" role="tab" aria-selected="false">エキスパート</button>
          <button type="button" class="battle-class-tab" data-class-value="1" role="tab" aria-selected="false">エリート</button>
        </div>

        <div id="battle-block-grid" class="battle-block-grid" role="group" aria-label="ブロック">
          <button type="button" class="battle-block-card" data-block-value="0" aria-pressed="true">
            <span class="battle-block-title">ブロックA</span>
            <span class="guild-grid" data-block-guild-grid="0" role="list" aria-live="polite"></span>
          </button>
          <button type="button" class="battle-block-card" data-block-value="1" aria-pressed="false">
            <span class="battle-block-title">ブロックB</span>
            <span class="guild-grid" data-block-guild-grid="1" role="list" aria-live="polite"></span>
          </button>
          <button type="button" class="battle-block-card" data-block-value="2" aria-pressed="false">
            <span class="battle-block-title">ブロックC</span>
            <span class="guild-grid" data-block-guild-grid="2" role="list" aria-live="polite"></span>
          </button>
          <button type="button" class="battle-block-card" data-block-value="3" aria-pressed="false">
            <span class="battle-block-title">ブロックD</span>
            <span class="guild-grid" data-block-guild-grid="3" role="list" aria-live="polite"></span>
          </button>
        </div>

        <div class="battle-selection-footer">
          <p id="battle-selection-summary" class="battle-selection-summary"></p>
          <div class="apply-data-actions">
            <p id="pending-message" class="pending-message" hidden><span aria-hidden="true">●</span> 未反映</p>
            <button type="button" id="apply-data-button" class="apply-data-button" disabled>データを反映</button>
          </div>
        </div>
      </section>

      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    </section>

      <div id="guild-name-editor-controls" hidden>
        <button type="button" id="edit-guild-names-button" class="score-edit-button" aria-label="ギルド名を編集" title="ギルド名を編集">
          <span class="score-edit-pen-icon" aria-hidden="true"></span>
        </button>
        <button type="button" id="confirm-guild-names-button" class="score-edit-button" aria-label="ギルド名の編集を確定" title="ギルド名の編集を確定" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12l4 4L19 6" />
          </svg>
        </button>
        <button type="button" id="cancel-guild-names-button" class="score-edit-button" aria-label="ギルド名の編集をキャンセル" title="ギルド名の編集をキャンセル" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12" />
            <path d="M18 6L6 18" />
          </svg>
        </button>
      </div>
    </div>

    <section class="panel map-panel" aria-labelledby="map-heading">
      <h2 id="map-heading" class="visually-hidden">拠点マップ</h2>
      <header class="tab-row">
        <nav id="occupation-tabs" class="occupation-tabs" aria-label="拠点状況タブ"></nav>
        <button type="button" id="tab-add-button" class="tab-add-button" aria-label="タブを追加" title="タブを追加">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
        </button>
        <div class="map-actions" role="group" aria-label="マップデータ操作">
          <button type="button" id="delete-tab-button" class="delete-tab-button">選択中のタブを削除</button>
          <button type="button" id="reset-data-button" class="reset-data-button">全データ初期化</button>
        </div>
      </header>

    <section class="map-container" aria-labelledby="map-heading">
      <div id="map-inner" class="map-inner">
        <img src="resource/map.png" alt="グランドバトル拠点マップ" class="map-image">
        <div id="battle-points"></div>
      </div>
      <div class="map-history-controls" role="group" aria-label="MAP操作">
        <button type="button" id="map-undo-button" class="map-history-button" aria-label="MAP編集を元に戻す" title="MAP編集を元に戻す" disabled>
          <span class="map-history-icon" aria-hidden="true"></span>
        </button>
        <button type="button" id="map-redo-button" class="map-history-button" aria-label="MAP編集をやり直す" title="MAP編集をやり直す" disabled>
          <span class="map-history-icon is-redo" aria-hidden="true"></span>
        </button>
        <button type="button" id="map-screenshot-button" class="map-history-button map-screenshot-button" aria-label="現在のMAPをPNG保存" title="現在のMAPをPNG保存">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 7h3l1.5-2h5L16 7h3v11H5z" />
            <circle cx="12" cy="12.5" r="3.2" />
          </svg>
        </button>
      </div>
      <div id="map-export-status" class="map-export-status" role="status" aria-live="polite" hidden>
        <span id="map-export-status-message"></span>
        <button type="button" id="map-export-save-button" class="map-export-save-button" hidden>保存</button>
      </div>
      <div class="map-zoom-controls" role="group" aria-label="MAP表示操作">
        <div class="map-zoom-actions">
          <span id="map-zoom-value" class="map-zoom-value" aria-live="polite">100%</span>
          <button type="button" id="map-zoom-in-button" class="map-zoom-button" aria-label="MAPを拡大">+</button>
          <button type="button" id="map-zoom-out-button" class="map-zoom-button" aria-label="MAPを縮小">-</button>
          <button type="button" id="map-view-reset-button" class="map-zoom-button" aria-label="MAP表示をリセット">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 4H4v4" />
              <path d="M16 4h4v4" />
              <path d="M20 16v4h-4" />
              <path d="M4 16v4h4" />
              <path d="M9 9h6v6H9z" />
            </svg>
          </button>
        </div>
      </div>
      <div id="map-visibility-controls" class="map-visibility-controls" role="group" aria-label="MAP要素表示切替"></div>
      <aside id="map-score-panel" class="map-score-panel" aria-labelledby="map-score-panel-title">
        <div class="map-score-panel-header">
          <h3 id="map-score-panel-title" class="visually-hidden">ギルドスコア</h3>
          <button type="button" id="map-score-panel-toggle" class="map-score-panel-toggle" aria-expanded="true" aria-controls="map-score-panel-body" aria-label="ギルドスコアを折り畳む" title="ギルドスコアを折り畳む">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m7 10 5 5 5-5" />
            </svg>
          </button>
        </div>
        <div id="map-score-panel-body" class="map-score-panel-body">
          <table id="map-score-table" class="map-score-table">
            <caption class="visually-hidden">ギルド別スコア</caption>
            <thead>
              <tr>
                <th scope="col">Guild</th>
                <th scope="col" aria-label="累計" title="累計">
                  <span class="map-score-symbol map-score-cumulative-symbol" role="img" aria-label="累計" title="累計">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="m2 6 7-4 7 4-7 4-7-4Z" />
                      <path d="m2 11 7 4 5-2.8" />
                      <path d="m2 17 7 4 5-2.8" />
                      <path d="M18 21V8m0 0-3 3m3-3 3 3" />
                    </svg>
                  </span>
                </th>
                <th scope="col" aria-label="合計" title="合計">
                  <span class="map-score-symbol map-score-total-symbol" role="img" aria-label="合計" title="合計">Σ</span>
                </th>
                <th scope="col" aria-label="神殿" title="神殿">
                  <img class="map-score-structure-icon map-score-temple-icon" src="resource/map-score-temple.png" alt="神殿">
                </th>
                <th scope="col" aria-label="城" title="城">
                  <img class="map-score-structure-icon map-score-castle-icon" src="resource/map-score-castle.png" alt="城">
                </th>
                <th scope="col" aria-label="教会" title="教会">
                  <img class="map-score-structure-icon map-score-church-icon" src="resource/map-score-church.png" alt="教会">
                </th>
              </tr>
            </thead>
            <tbody id="map-score-body"></tbody>
          </table>
        </div>
      </aside>
    </section>
    </section>

    <div id="mobile-point-picker" class="mobile-point-picker" role="dialog" aria-modal="true" aria-labelledby="mobile-point-picker-title" hidden>
      <div class="mobile-point-picker-panel">
        <div class="mobile-point-picker-header">
          <strong id="mobile-point-picker-title">拠点選択</strong>
          <button type="button" id="mobile-point-picker-close" class="mobile-picker-close" aria-label="閉じる">×</button>
        </div>
        <div id="mobile-point-picker-options" class="mobile-point-picker-options"></div>
      </div>
    </div>

    <dialog id="battle-data-confirmation-dialog" class="battle-data-dialog" aria-labelledby="battle-data-dialog-title" aria-describedby="battle-data-dialog-message">
      <form method="dialog" class="battle-data-dialog-panel">
        <h2 id="battle-data-dialog-title" data-dialog-title></h2>
        <p data-dialog-message></p>
        <p class="battle-data-dialog-context" data-dialog-context hidden></p>
        <p class="battle-data-dialog-note" data-dialog-note hidden></p>
        <div class="battle-data-dialog-actions" role="group" aria-label="反映方法を選択">
          <button type="button" class="dialog-secondary-button" data-dialog-action="cancel">キャンセル</button>
          <button type="button" class="dialog-secondary-button" data-dialog-action="new-tab" hidden>新しいタブ</button>
          <button type="button" class="dialog-primary-button" data-dialog-action="overwrite" hidden>上書き</button>
          <button type="button" class="dialog-danger-button" data-dialog-action="replace" hidden>データを反映</button>
        </div>
      </form>
    </dialog>
  </main>

  <footer>
    (c)BANK OF INNOVATION 該当画像の転載・配布等は禁止しております。
  </footer>

  <script type="module" src="js/main.js?v=20260810-context-labels"></script>
</body>
</html>
