<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Battle Simulator</title>
  <link rel="stylesheet" href="style.css?v=20260512-mobile-map-assets">
</head>
<body>
  <main class="app-shell">
    <div class="top-layout">
      <section class="panel source-panel">
      <div class="source-grid">
        <label>
          <span>サーバー</span>
          <select id="server-select">
            <option value="1">Japan</option>
            <option value="2">Korea</option>
            <option value="3">Asia</option>
            <option value="4">North America</option>
            <option value="5">Europe</option>
            <option value="6">Global</option>
          </select>
        </label>

        <label>
          <span>ワールド</span>
          <div class="combo-box">
            <input type="text" id="world-input" name="grand-battle-world" placeholder="W1" autocomplete="new-password" inputmode="numeric" aria-controls="world-suggestions">
            <datalist id="world-options"></datalist>
            <div id="world-suggestions" class="combo-options" role="listbox" hidden></div>
          </div>
        </label>

        <label>
          <span>クラス</span>
          <select id="class-select">
            <option value="3">グランドマスター</option>
            <option value="2">エキスパート</option>
            <option value="1">エリート</option>
          </select>
        </label>

        <label>
          <span>ブロック</span>
          <select id="block-select">
            <option value="0">A</option>
            <option value="1">B</option>
            <option value="2">C</option>
            <option value="3">D</option>
          </select>
        </label>
      </div>

      <div class="guild-display" aria-labelledby="guild-heading">
        <h3 id="guild-heading">ギルド名</h3>
        <div id="guild-grid" class="guild-grid" aria-live="polite"></div>
        <button type="button" id="apply-data-button" class="apply-data-button" disabled>データを反映</button>
        <p id="pending-message" class="pending-message" hidden>未反映データがあります</p>
      </div>

      <p id="status-message" class="status-message" aria-live="polite"></p>
    </section>

      <hr class="section-divider">

      <section class="panel score-panel" aria-labelledby="score-heading">
      <h2 id="score-heading">獲得ポイント</h2>
      <p id="cumulative-scope" class="cumulative-scope"></p>
      <div class="score-edit-actions" aria-label="ギルド名編集">
        <button type="button" id="edit-guild-names-button" class="score-edit-button" aria-label="ギルド名を編集" title="ギルド名を編集">
          <svg xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              width="24" height="24"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true">
            <path d="M4 22 C4.04 21.72 4.16 20.58 4.25 20.02 C4.34 19.46 4.51 18.61 4.64 18.06 C4.77 17.51 5.01 16.67 5.19 16.13 C5.37 15.59 5.67 14.77 5.88 14.25 C6.09 13.73 6.45 12.94 6.7 12.43 C6.95 11.92 7.36 11.16 7.65 10.67 C7.94 10.18 8.41 9.45 8.73 8.99 C9.05 8.53 9.58 7.83 9.94 7.4 C10.3 6.97 10.88 6.32 11.28 5.92 C11.68 5.52 12.34 4.94 12.78 4.59 C13.22 4.24 13.95 3.73 14.42 3.45 C14.89 3.17 15.61 2.79 16.11 2.63 C16.61 2.47 17.45 2.28 17.97 2.33 C18.49 2.38 19.48 2.62 19.75 3 C20.02 3.38 19.98 4.44 19.85 4.99 C19.72 5.54 19.21 6.37 18.86 6.85 C18.51 7.33 17.85 8 17.38 8.36 C16.91 8.72 16.09 9.16 15.54 9.4 C14.99 9.64 13.97 9.93 13.53 10.04 C13.09 10.15 12.6 10.14 12.45 10.16"/>
            <path d="M12.15 10.29 C12.44 10.29 13.33 10.25 13.91 10.28 C14.49 10.31 15.1 10.2 15.65 10.45 C16.2 10.7 17.01 11.24 17.2 11.76 C17.39 12.28 17.15 13.11 16.79 13.56 C16.43 14.01 15.66 14.29 15.03 14.46 C14.41 14.63 13.7 14.6 13.04 14.59 C12.38 14.58 11.64 14.46 11.05 14.38 C10.46 14.3 9.77 14.15 9.51 14.1"/>
            <path d="M9.59 14.18 C9.91 14.27 10.86 14.49 11.51 14.74 C12.16 14.99 13.1 15.18 13.49 15.67 C13.88 16.16 14.1 17.21 13.83 17.66 C13.56 18.11 12.56 18.28 11.88 18.38 C11.2 18.48 10.41 18.35 9.73 18.24 C9.05 18.13 8.27 17.89 7.79 17.75 C7.31 17.61 6.99 17.45 6.83 17.39"/>
          </svg>
        </button>
        <button type="button" id="confirm-guild-names-button" class="score-edit-button" aria-label="ギルド名の編集を確定" title="ギルド名の編集を確定" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12l4 4L19 6" />
          </svg>
        </button>
        <button type="button" id="cancel-guild-names-button" class="score-edit-button" aria-label="ギルド名の編集をキャンセル" title="ギルド名の編集をキャンセル" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12" />
            <path d="M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="table-scroll">
        <table class="score-table">
          <thead>
            <tr>
              <th class="score-icon-header"></th>
              <th>ギルド名</th>
              <th>神殿</th>
              <th>城</th>
              <th>教会</th>
              <th>合計</th>
              <th>累計</th>
            </tr>
          </thead>
          <tbody id="score-body"></tbody>
        </table>
      </div>
    </section>

    </div>

    <section class="panel map-panel">
      <div class="tab-row">
        <nav id="occupation-tabs" class="occupation-tabs" aria-label="拠点状況タブ"></nav>
        <button type="button" id="tab-add-button" class="tab-add-button" aria-label="タブを追加" title="タブを追加">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
        </button>
        <div class="map-actions">
          <button type="button" id="delete-tab-button" class="delete-tab-button">選択中のタブを削除</button>
          <button type="button" id="reset-data-button" class="reset-data-button">全データ初期化</button>
        </div>
    </div>

    <section class="map-container" aria-label="拠点マップ">
      <div id="map-inner" class="map-inner">
        <img src="resource/map.png" alt="グランドバトル拠点マップ" class="map-image">
        <div id="battle-points"></div>
      </div>
      <div class="map-zoom-controls" aria-label="MAP表示操作">
        <span id="map-zoom-value" class="map-zoom-value" aria-live="polite">100%</span>
        <button type="button" id="map-zoom-in-button" class="map-zoom-button" aria-label="MAPを拡大">+</button>
        <button type="button" id="map-zoom-out-button" class="map-zoom-button" aria-label="MAPを縮小">-</button>
        <button type="button" id="map-view-reset-button" class="map-zoom-button" aria-label="MAP表示をリセット">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 4H4v4" />
            <path d="M16 4h4v4" />
            <path d="M20 16v4h-4" />
            <path d="M4 16v4h4" />
            <path d="M9 9h6v6H9z" />
          </svg>
        </button>
      </div>
    </section>
    </section>

    <div id="mobile-point-picker" class="mobile-point-picker" hidden>
      <div class="mobile-point-picker-panel">
        <div class="mobile-point-picker-header">
          <strong id="mobile-point-picker-title">拠点選択</strong>
          <button type="button" id="mobile-point-picker-close" class="mobile-picker-close" aria-label="閉じる">×</button>
        </div>
        <div id="mobile-point-picker-options" class="mobile-point-picker-options"></div>
      </div>
    </div>
  </main>

  <footer>
    (c)BANK OF INNOVATION 該当画像の転載・配布等は禁止しております。
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
